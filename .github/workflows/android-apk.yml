name: Build PlusNet Android APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CI: true
  ANDROID_VERSION_CODE: '7'

jobs:
  build-android:
    name: Build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate release tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(node --input-type=module -e "import fs from 'node:fs'; console.log(JSON.parse(fs.readFileSync('package.json', 'utf8')).version)")"
          PLUGIN_VERSION="$(node --input-type=module -e "import fs from 'node:fs'; console.log(JSON.parse(fs.readFileSync('plugins/plusnet-engine/package.json', 'utf8')).version)")"
          EXPECTED_TAG="v${PACKAGE_VERSION}"
          if [[ "$GITHUB_REF_NAME" != "$EXPECTED_TAG" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PACKAGE_VERSION (expected $EXPECTED_TAG)."
            exit 1
          fi
          if [[ "$PLUGIN_VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "Native plugin version $PLUGIN_VERSION does not match app version $PACKAGE_VERSION."
            exit 1
          fi
          echo "Release tag and native plugin version match PlusNet $PACKAGE_VERSION."

      # Keep the same debug certificate between workflow runs so a new APK can
      # update the previously installed test build instead of requiring uninstall.
      - name: Restore persistent debug signing key
        uses: actions/cache@v5
        with:
          path: ~/.android/debug.keystore
          key: plusnet-debug-keystore-v1

      - name: Verify local PlusNet Android plugin is tracked
        shell: bash
        run: |
          set -euo pipefail
          test -f plugins/plusnet-engine/package.json
          test -f plugins/plusnet-engine/android/build.gradle
          test -f plugins/plusnet-engine/android/src/main/AndroidManifest.xml
          test -f plugins/plusnet-engine/android/src/main/java/app/plusnet/engine/PlusNetEnginePlugin.java
          echo "PlusNet native Android plugin files are present."

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          PREINSTALLED_SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$PREINSTALLED_SDK/cmdline-tools" -type f -name sdkmanager -print 2>/dev/null | sort -V | tail -n 1)"

          if [[ -z "$SDKMANAGER" || ! -r "$SDKMANAGER" ]]; then
            echo "Readable sdkmanager not found under: $PREINSTALLED_SDK/cmdline-tools"
            ls -la "$PREINSTALLED_SDK/cmdline-tools" || true
            exit 1
          fi

          SDK_ROOT="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          echo "Using sdkmanager: $SDKMANAGER"
          echo "Installing Android SDK into: $SDK_ROOT"

          set +o pipefail
          yes | bash "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null
          set -o pipefail

          bash "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "cmdline-tools;latest" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Run TypeScript utility tests
        run: npm test

      - name: Run native chunk scheduler tests
        run: npm run test:native

      - name: Build web app
        run: npm run build

      - name: Generate Capacitor Android project
        run: npx cap add android

      - name: Generate PlusNet Android app icons
        run: npx @capacitor/assets generate --android

      - name: Set Android app version
        run: node scripts/set-android-version.mjs

      - name: Sync Capacitor and local PlusNet plugin
        run: npx cap sync android

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace --warning-mode all

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: plusnet-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create APK checksum
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node --input-type=module -e "import fs from 'node:fs'; console.log(JSON.parse(fs.readFileSync('package.json', 'utf8')).version)")"
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          APK_LABEL="PlusNet-${VERSION}-debug.apk"
          cp "$APK" "$APK_LABEL"
          sha256sum "$APK_LABEL" > "PlusNet-${VERSION}-SHA256SUMS.txt"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node --input-type=module -e "import fs from 'node:fs'; console.log(JSON.parse(fs.readFileSync('package.json', 'utf8')).version)")"
          APK_LABEL="PlusNet-${VERSION}-debug.apk"
          CHECKSUM="PlusNet-${VERSION}-SHA256SUMS.txt"

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              "$APK_LABEL" "$CHECKSUM" --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "$APK_LABEL" "$CHECKSUM" \
              --verify-tag \
              --title "PlusNet v${VERSION}" \
              --notes-file RELEASE_NOTES.md \
              --latest
          fi

      - name: Upload Gradle diagnostics if build fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: plusnet-gradle-diagnostics
          path: |
            android/**/build/reports/**
            android/.gradle/daemon/**/daemon-*.out.log
          if-no-files-found: ignore
          retention-days: 7
